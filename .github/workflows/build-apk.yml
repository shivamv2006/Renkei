name: Build Renkei Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK & Permissions
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Export Next.js Web App
        env:
          NEXT_EXPORT: "true"
          NEXT_PUBLIC_APP_NAME: "Renkei"
          NEXT_PUBLIC_APP_TAGLINE: "stay in sync • connect & coordinate"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://khnrurrsgeoyejywzktk.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_EP4rk35PmTgyKYewuUG9dA_Hl1Np_y7' }}
          NEXT_PUBLIC_APP_URL: "https://renkei.app"
          NEXT_PUBLIC_STUN_SERVERS: "stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302,stun:stun2.l.google.com:19302"
        run: |
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r out/* android/app/src/main/assets/public/

      - name: Capacitor Sync Android
        run: |
          npx cap sync android || npx cap copy android || true

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Renkei APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Renkei-v2.0-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
